org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
fabric_loader_version=0.19.3
loom_version=1.17.19
shadow_version=9.6.1

kalic0re_shared_packages=display,aim,glow,vehicle,rule,config,text,command

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25

# Dev server
dev_server_ports=25600-25800
dev_rcon_password=dev
dev_client_username=TestPlayer

quilt_loader_version=0.31.0-beta.4
quilt_sponge_mixin_version=0.17.4+mixin.0.8.7
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_asm_version=9.10.1
quilt_mixinextras_version=0.5.5

# Mod Properties
mod_version = 0.2.1
mod_name = Polytrains
mod_description = Server-side trains that don't suck, with Polymer.
mod_authors = ["Kalic0"]
mod_website = https://github.com/RainbowKittyClub/Polytrains
mod_issues = https://github.com/RainbowKittyClub/Polytrains/issues
mod_license = CC0-1.0


# Project Properties
maven_group = club.rainbowkitty.polytrains
mod_id = polytrains
entrypoint = club.rainbowkitty.polytrains.Polytrains
stonecutter_version=0.9.8
# Multi-version build: one node per version under versions/, see gradle/stonecutter-opt-in.sh.
stonecutter_versions=26.2,26.3
stonecutter_vcs_version=26.2
dev.kikugie.stonecutter.hard_mode=true
