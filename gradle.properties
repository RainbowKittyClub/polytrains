org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
minecraft_version=26.2
fabric_loader_version=0.19.3
fabric_version=0.157.0+26.2
loom_version=1.17.19
shadow_version=9.6.1
polymer_version=0.17.3+26.2

# Shaded from mavenLocal; rebuild kalic0re with publishToMavenLocal when its shared helpers change.
# Only the common/ subpackages listed here come across.
kalic0re_version=0.14.0
kalic0re_shared_packages=display

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25


# Mod Properties
mod_version = 0.1.0
mod_name = Minecart Tweaks
mod_description = Making minecarts more viable for transportation
mod_authors = ["Kalic0"]
mod_website = https://github.com/RainbowKittyClub/Cammies-Minecart-Tweaks
mod_issues = https://github.com/RainbowKittyClub/Cammies-Minecart-Tweaks/issues
mod_license = MIT


# Project Properties
maven_group = club.rainbowkitty.minecarttweaks
mod_id = minecarttweaks
entrypoint = club.rainbowkitty.minecarttweaks.MinecartTweaks
